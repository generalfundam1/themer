bar {
	font pango:{{font_family}} {{font_size}}
	colors {
		background #{{bg}}
		statusline #{{fg}}
		separator #{{surf}}
		focused_workspace #{{acc}} #{{acc}} #{{accfg}}
		active_workspace #{{surf}} #{{surf}} #{{fg}}
		inactive_workspace #{{bg}} #{{bg}} #{{fg}}
		urgent_workspace #{{urg}} #{{urg}} #{{on_urg}}
		binding_mode #{{warn}} #{{warn}} #{{on_warn}}
	}
}
