# generated by themer ({{theme}}, {{mode}}): Themer Chicago: a grey taskbar
# A grey status line like a taskbar, the current window raised in the accent; the
# active pane and selections take the accent too.
set -gq status-style "bg=#{{face}},fg=#{{bar_text}}"
set -gq window-status-style "bg=#{{face}},fg=#{{tab_text}}"
set -gq window-status-current-style "bg=#{{acc}},fg=#{{tab_active_text}}"
set -gq window-status-bell-style "bg=#{{urg}},fg=#{{on_urg}}"
set -gq window-status-activity-style "reverse"
set -gq message-style "bg=#{{warn}},fg=#{{on_warn}}"
set -gq message-command-style "bg=#{{bg}},fg=#{{warn}}"
set -gq mode-style "bg=#{{acc}},fg=#{{accfg}}"
set -gq pane-border-style "fg=#{{line}}"
set -gq pane-active-border-style "fg=#{{acc}}"
set -gq popup-style "bg=#{{face}},fg=#{{fg}}"
set -gq popup-border-style "fg=#{{line}}"
set -gq menu-style "bg=#{{face}},fg=#{{fg}}"
set -gq menu-selected-style "bg=#{{acc}},fg=#{{accfg}}"
set -gq menu-border-style "fg=#{{line}}"
set -gq display-panes-colour "#{{line}}"
set -gq display-panes-active-colour "#{{acc}}"
set -gq clock-mode-colour "#{{acc}}"
set -gq copy-mode-match-style "bg=#{{warn}},fg=#{{on_warn}}"
set -gq copy-mode-current-match-style "bg=#{{acc}},fg=#{{accfg}}"
