# generated by themer: the dunst module's drop-in, read after your dunstrc
# Chicago: square boxes on the window color with a 1px outline, the progress bar in
# the accent, low urgency in the dimmed text, a critical one in the urgent color.
[global]
    font = "{{font_family}} {{font_size}}"
    frame_width = 1
    frame_color = "#{{line}}"
    separator_color = frame
    highlight = "#{{acc}}"
    corner_radius = 0

[urgency_low]
    background = "#{{bg}}"
    foreground = "#{{disabled}}"
    frame_color = "#{{line}}"
    highlight = "#{{acc}}"

[urgency_normal]
    background = "#{{bg}}"
    foreground = "#{{fg}}"
    frame_color = "#{{line}}"
    highlight = "#{{acc}}"

[urgency_critical]
    background = "#{{urg}}"
    foreground = "#{{on_urg}}"
    frame_color = "#{{line}}"
    highlight = "#{{on_urg}}"
