# generated by themer ({{theme}}, {{mode}}): Hyprland, square and flat.
# Sourced last from hyprland.conf. The focused window is outlined in the accent,
# the rest in the line color; nothing is rounded and nothing casts a shadow. The
# groupbar is a row of tabs: the active one in the accent, the others on the face.
general {
	col.active_border = rgba({{acc}}ff)
	col.inactive_border = rgba({{line}}ff)
	col.nogroup_border = rgba({{line}}ff)
	col.nogroup_border_active = rgba({{warn}}ff)
}
decoration {
	rounding = 0
	shadow {
		enabled = false
	}
}
group {
	col.border_active = rgba({{acc}}ff)
	col.border_inactive = rgba({{line}}ff)
	col.border_locked_active = rgba({{warn}}ff)
	col.border_locked_inactive = rgba({{shade}}ff)
	groupbar {
		font_family = {{font_family}}
		font_size = {{font_size}}
		gradients = true
		rounding = 0
		gradient_rounding = 0
		text_color = rgba({{tab_active_text}}ff)
		text_color_inactive = rgba({{tab_text}}ff)
		text_color_locked_active = rgba({{on_warn}}ff)
		text_color_locked_inactive = rgba({{tab_text}}ff)
		col.active = rgba({{acc}}ff)
		col.inactive = rgba({{face}}ff)
		col.locked_active = rgba({{warn}}ff)
		col.locked_inactive = rgba({{face}}ff)
	}
}
misc {
	font_family = {{font_family}}
	background_color = rgb({{bg}})
}
