# themer: the keys the fuzzel module sets in ~/.config/fuzzel/fuzzel.ini.
# Chicago: a square menu on the window color with a 1px outline, the selection in
# the accent, as the dmenu and wmenu launchers draw it. Colors are RRGGBBAA.
[main]
font={{font_family}}:size={{font_size}}

[colors]
background={{bg}}ff
text={{fg}}ff
prompt={{fg}}ff
placeholder={{disabled}}ff
input={{input_text}}ff
match={{warn}}ff
selection={{acc}}ff
selection-text={{accfg}}ff
selection-match={{accfg}}ff
counter={{disabled}}ff
border={{line}}ff

[border]
width=1
radius=0
