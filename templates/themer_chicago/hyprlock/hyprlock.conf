# generated by themer ({{theme}}, {{mode}}): a lock screen, square and flat. themer
# wrote it because you had no hyprlock.conf; write your own and themer gives it
# $themer_* colors instead (see themer-colors.conf).
$font = {{font_family}}

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb({{bg}})
}

# the password field: a sunken field on the face, outlined, the accent while it
# checks, the urgent color when it fails
input-field {
    monitor =
    size = 320, 36
    outline_thickness = 1
    rounding = 0
    outer_color = rgb({{line}})
    inner_color = rgb({{input}})
    font_color = rgb({{input_text}})
    check_color = rgb({{acc}})
    fail_color = rgb({{urg}})
    fade_on_empty = false

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb({{fg}})
    font_size = 48
    font_family = $font

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb({{fg}})
    font_size = {{font_size}}
    font_family = $font

    position = 0, 30
    halign = center
    valign = center
}
