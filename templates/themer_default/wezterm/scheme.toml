# generated by themer ({{theme}}, {{mode}}): WezTerm as it comes, in the theme's colors

[metadata]
name = "themer"

[colors]
foreground = "#{{fg}}"
background = "#{{bg}}"
cursor_bg = "#{{fg}}"
cursor_fg = "#{{bg}}"
cursor_border = "#{{fg}}"
selection_fg = "#{{accfg}}"
selection_bg = "#{{acc}}"
scrollbar_thumb = "#{{surf}}"
split = "#{{line}}"
visual_bell = "#{{surf}}"
compose_cursor = "#{{warn}}"
ansi = ["#{{ansi0}}", "#{{ansi1}}", "#{{ansi2}}", "#{{ansi3}}", "#{{ansi4}}", "#{{ansi5}}", "#{{ansi6}}", "#{{ansi7}}"]
brights = ["#{{ansi8}}", "#{{ansi9}}", "#{{ansi10}}", "#{{ansi11}}", "#{{ansi12}}", "#{{ansi13}}", "#{{ansi14}}", "#{{ansi15}}"]

# the tab bar: the focused tab in the accent
[colors.tab_bar]
background = "#{{bg}}"
inactive_tab_edge = "#{{line}}"

[colors.tab_bar.active_tab]
bg_color = "#{{acc}}"
fg_color = "#{{accfg}}"

[colors.tab_bar.inactive_tab]
bg_color = "#{{surf}}"
fg_color = "#{{fg}}"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#{{control_hover}}"
fg_color = "#{{fg}}"

[colors.tab_bar.new_tab]
bg_color = "#{{bg}}"
fg_color = "#{{fg}}"

[colors.tab_bar.new_tab_hover]
bg_color = "#{{control_hover}}"
fg_color = "#{{fg}}"
