# generated by themer ({{theme}}, {{mode}}): lazygit's own look in the theme's
# colors. Read after your config.yml (LG_CONFIG_FILE lists both), so only these
# keys are taken from here: the focused panel's border and the selected line are
# the accent, as focus and selection are everywhere (a muted accent in a panel
# without the focus); the rest keeps lazygit's hues, from the theme's terminal colors.
gui:
  theme:
    activeBorderColor:
      - "#{{acc}}"
      - bold
    inactiveBorderColor:
      - "#{{line}}"
    searchingActiveBorderColor:
      - "#{{warn}}"
      - bold
    optionsTextColor:
      - "#{{ansi4}}"
    selectedLineBgColor:
      - "#{{acc}}"
    selectedLineFgColor:
      - "#{{accfg}}"
      - bold
    inactiveViewSelectedLineBgColor:
      - "#{{inactive_sel}}"
    cherryPickedCommitFgColor:
      - "#{{ansi4}}"
    cherryPickedCommitBgColor:
      - "#{{ansi6}}"
    markedBaseCommitFgColor:
      - "#{{ansi4}}"
    markedBaseCommitBgColor:
      - "#{{ansi3}}"
    unstagedChangesColor:
      - "#{{urg}}"
    defaultFgColor:
      - "#{{fg}}"
