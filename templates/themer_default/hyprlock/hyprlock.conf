# generated by themer ({{theme}}, {{mode}}): hyprlock's own example lock screen in the
# theme's colors. themer wrote it because you had no hyprlock.conf; write your own
# and themer gives it $themer_* colors instead (see themer-colors.conf).
$font = {{font_family}}

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgb({{bg}})
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba({{acc}}ee) rgba({{ansi2}}ee) 45deg
    check_color = rgba({{ansi2}}ee) rgba({{warn}}ee) 120deg
    fail_color = rgba({{warn}}ee) rgba({{urg}}ee) 40deg

    font_color = rgb({{fg}})
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# the time
label {
    monitor =
    text = $TIME
    color = rgb({{fg}})
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# the date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb({{fg}})
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
