# generated by themer ({{theme}}, {{mode}}): Hyprland's own look in the theme's colors.
# Sourced last from hyprland.conf, so only what is set here changes; your gaps,
# rounding, shadows and blur stay yours. The active border keeps Hyprland's
# two-color gradient, from the accent to the theme's green; groups keep its yellow
# and orange, from the terminal colors.
general {
	col.active_border = rgba({{acc}}ee) rgba({{ansi2}}ee) 45deg
	col.inactive_border = rgba({{line}}aa)
	col.nogroup_border = rgba({{ansi13}}ff)
	col.nogroup_border_active = rgba({{ansi5}}ff)
}
group {
	col.border_active = rgba({{ansi11}}66)
	col.border_inactive = rgba({{ansi3}}66)
	col.border_locked_active = rgba({{ansi9}}66)
	col.border_locked_inactive = rgba({{ansi1}}66)
	groupbar {
		font_family = {{font_family}}
		font_size = {{font_size}}
		text_color = rgba({{fg}}ff)
		col.active = rgba({{ansi11}}66)
		col.inactive = rgba({{ansi3}}66)
		col.locked_active = rgba({{ansi9}}66)
		col.locked_inactive = rgba({{ansi1}}66)
	}
}
misc {
	font_family = {{font_family}}
	background_color = rgb({{bg}})
}
