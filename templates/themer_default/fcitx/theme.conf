# generated by themer ({{theme}}, {{mode}}): the candidate window on a raised surface with a thin border, the selected candidate in the accent
# fcitx5's classic UI theme (the format of fcitx5's own themes/default/theme.conf);
# the fonts are set in ~/.config/fcitx5/conf/classicui.conf
[Metadata]
Name=themer
Version=1
Author=themer
Description=themer: {{theme}}, {{mode}}

[InputPanel]
NormalColor=#{{fg}}
HighlightCandidateColor=#{{accfg}}
HighlightColor=#{{accfg}}
HighlightBackgroundColor=#{{acc}}
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#{{raised}}
BorderColor=#{{line}}
BorderWidth=1

[InputPanel/Background/Margin]
Left=1
Right=1
Top=1
Bottom=1

[InputPanel/Highlight]
Color=#{{acc}}

[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#{{fg}}
HighlightCandidateColor=#{{accfg}}

[Menu/Background]
Color=#{{raised}}
BorderColor=#{{line}}
BorderWidth=1

[Menu/Background/Margin]
Left=1
Right=1
Top=1
Bottom=1

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#{{acc}}

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#{{line}}

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
