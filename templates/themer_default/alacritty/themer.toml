# generated by themer ({{theme}}, {{mode}}): Alacritty as it comes, in the theme's colors

[font]
size = {{font_size}}

[font.normal]
family = "{{font_family}}"

[colors.primary]
background = "#{{bg}}"
foreground = "#{{fg}}"

[colors.cursor]
text = "#{{bg}}"
cursor = "#{{fg}}"

[colors.vi_mode_cursor]
text = "#{{bg}}"
cursor = "#{{acc}}"

[colors.selection]
text = "#{{accfg}}"
background = "#{{acc}}"

[colors.search.matches]
foreground = "#{{on_warn}}"
background = "#{{warn}}"

[colors.search.focused_match]
foreground = "#{{accfg}}"
background = "#{{acc}}"

[colors.hints.start]
foreground = "#{{on_warn}}"
background = "#{{warn}}"

[colors.hints.end]
foreground = "#{{fg}}"
background = "#{{surf}}"

[colors.footer_bar]
foreground = "#{{fg}}"
background = "#{{surf}}"

[colors.normal]
black = "#{{ansi0}}"
red = "#{{ansi1}}"
green = "#{{ansi2}}"
yellow = "#{{ansi3}}"
blue = "#{{ansi4}}"
magenta = "#{{ansi5}}"
cyan = "#{{ansi6}}"
white = "#{{ansi7}}"

[colors.bright]
black = "#{{ansi8}}"
red = "#{{ansi9}}"
green = "#{{ansi10}}"
yellow = "#{{ansi11}}"
blue = "#{{ansi12}}"
magenta = "#{{ansi13}}"
cyan = "#{{ansi14}}"
white = "#{{ansi15}}"
