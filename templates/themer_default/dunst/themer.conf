# generated by themer: the dunst module's drop-in, read after your dunstrc
# Dunst's own look (square, a 3px frame), in the theme's colors: notifications on the
# raised tone, the progress bar in the accent, low urgency in the dimmed text, a
# critical one in the urgent color.
[global]
    font = "{{font_family}} {{font_size}}"
    frame_width = 3
    frame_color = "#{{line}}"
    separator_color = frame
    highlight = "#{{acc}}"
    corner_radius = 0

[urgency_low]
    background = "#{{raised}}"
    foreground = "#{{disabled}}"
    frame_color = "#{{line}}"
    highlight = "#{{acc}}"

[urgency_normal]
    background = "#{{raised}}"
    foreground = "#{{fg}}"
    frame_color = "#{{line}}"
    highlight = "#{{acc}}"

[urgency_critical]
    background = "#{{urg}}"
    foreground = "#{{on_urg}}"
    frame_color = "#{{urg}}"
    highlight = "#{{on_urg}}"
