# generated by themer ({{theme}}, {{mode}}): Helix in the theme's colors.
# Helix's own layout of a theme, drawn from the theme's roles and its sixteen
# terminal colors: the syntax in the terminal colors, the interface in the roles.

"ui.background" = { bg = "bg" }
"ui.background.separator" = { fg = "line" }
"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "accfg", bg = "acc" }
"ui.text.inactive" = { fg = "dim" }
"ui.text.info" = { fg = "fg" }
# the directory part of a path in the file picker: no color of its own, so it takes
# the row's (fg, or accfg on the selected row) instead of falling back to fg on both
"ui.text.directory" = {}
"ui.cursor" = { fg = "bg", bg = "fg" }
"ui.cursor.primary" = { fg = "bg", bg = "acc" }
"ui.cursor.match" = { fg = "acc", modifiers = ["bold", "underlined"] }
"ui.cursor.select" = { fg = "bg", bg = "fg" }
"ui.cursor.insert" = { fg = "bg", bg = "acc" }
"ui.cursorline.primary" = { bg = "surf" }
"ui.cursorcolumn.primary" = { bg = "surf" }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.highlight" = { bg = "surf" }
"ui.linenr" = { fg = "dim" }
"ui.linenr.selected" = { fg = "acc", modifiers = ["bold"] }
"ui.gutter" = { bg = "bg" }
"ui.statusline" = { fg = "accfg", bg = "acc" }
"ui.statusline.inactive" = { fg = "fg", bg = "surf" }
"ui.statusline.normal" = { fg = "accfg", bg = "acc", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "magenta", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "line" }
"ui.bufferline" = { fg = "fg", bg = "surf" }
"ui.bufferline.active" = { fg = "accfg", bg = "acc" }
"ui.bufferline.background" = { bg = "bg" }
"ui.popup" = { fg = "fg", bg = "surf" }
"ui.popup.info" = { fg = "fg", bg = "surf" }
"ui.window" = { fg = "line" }
"ui.help" = { fg = "fg", bg = "surf" }
"ui.menu" = { fg = "fg", bg = "surf" }
"ui.menu.selected" = { fg = "accfg", bg = "acc" }
"ui.menu.scroll" = { fg = "dim", bg = "surf" }
"ui.picker.header" = { fg = "acc", modifiers = ["bold"] }
"ui.virtual" = { fg = "dim" }
"ui.virtual.whitespace" = { fg = "line" }
"ui.virtual.indent-guide" = { fg = "line" }
"ui.virtual.ruler" = { bg = "surf" }
"ui.virtual.inlay-hint" = { fg = "dim" }
"ui.virtual.jump-label" = { fg = "warn", modifiers = ["bold"] }

"comment" = { fg = "dim", modifiers = ["italic"] }
"keyword" = { fg = "magenta" }
"keyword.control" = { fg = "magenta" }
"keyword.function" = { fg = "magenta" }
"operator" = { fg = "fg" }
"punctuation" = { fg = "fg" }
"punctuation.delimiter" = { fg = "dim" }
"function" = { fg = "blue" }
"function.macro" = { fg = "cyan" }
"function.builtin" = { fg = "blue" }
"type" = { fg = "cyan" }
"type.builtin" = { fg = "cyan" }
"constructor" = { fg = "cyan" }
"constant" = { fg = "yellow" }
"constant.numeric" = { fg = "yellow" }
"constant.character.escape" = { fg = "cyan" }
"string" = { fg = "green" }
"string.regexp" = { fg = "cyan" }
"string.special" = { fg = "blue" }
"variable" = { fg = "fg" }
"variable.builtin" = { fg = "red" }
"variable.parameter" = { fg = "fg" }
"variable.other.member" = { fg = "blue" }
"label" = { fg = "magenta" }
"namespace" = { fg = "cyan" }
"attribute" = { fg = "yellow" }
"tag" = { fg = "magenta" }
# fuzzy matches in pickers and menus: drawn on the selected line (acc) as well as
# on the others, so a weight and an underline rather than a color
"special" = { modifiers = ["bold", "underlined"] }

"markup.heading" = { fg = "blue", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }
"markup.link.text" = { fg = "magenta" }
"markup.quote" = { fg = "dim" }
"markup.raw" = { fg = "green" }
"markup.list" = { fg = "yellow" }

"diff.plus" = { fg = "green" }
"diff.minus" = { fg = "red" }
"diff.delta" = { fg = "yellow" }

"error" = { fg = "urg" }
"warning" = { fg = "warn" }
"info" = { fg = "blue" }
"hint" = { fg = "dim" }
"diagnostic.error" = { underline = { color = "urg", style = "curl" } }
"diagnostic.warning" = { underline = { color = "warn", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "dim", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

[palette]
bg = "#{{bg}}"
fg = "#{{fg}}"
surf = "#{{surf}}"
acc = "#{{acc}}"
accfg = "#{{accfg}}"
urg = "#{{urg}}"
warn = "#{{warn}}"
line = "#{{line}}"
dim = "#{{disabled}}"
selection = "#{{control_active}}"
red = "#{{ansi1}}"
green = "#{{ansi2}}"
yellow = "#{{ansi3}}"
blue = "#{{ansi4}}"
magenta = "#{{ansi5}}"
cyan = "#{{ansi6}}"
