# generated by themer ({{theme}}, {{mode}}): vivid's default theme (molokai) in
# the theme's colors, for LS_COLORS: its file kinds keep their hues, from the
# theme's terminal colors.
colors:
  background_color: "{{bg}}"
  purple: "{{ansi13}}"
  khaki: "{{ansi3}}"
  pink: "{{ansi5}}"
  cyan: "{{ansi6}}"
  green: "{{ansi2}}"
  orange: "{{warn}}"

  white: "{{fg}}"
  black: "{{bg}}"
  red: "{{urg}}"
  gray: "{{gray}}"
  dimgray: "{{disabled}}"
  gold: "{{ansi11}}"
  springgreen: "{{ansi10}}"
  darkgray: "{{surf}}"

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}

  directory:
    foreground: cyan

  symlink:
    foreground: pink

  multi_hard_link: {}

  fifo:
    foreground: black
    background: cyan

  socket:
    foreground: black
    background: pink

  door:
    foreground: black
    background: pink

  block_device:
    foreground: cyan
    background: darkgray

  character_device:
    foreground: pink
    background: darkgray

  broken_symlink:
    foreground: black
    background: red

  missing_symlink_target:
    foreground: black
    background: red

  setuid: {}

  setgid: {}

  file_with_capability: {}

  sticky_other_writable: {}

  other_writable: {}

  sticky: {}

  executable_file:
    foreground: pink
    font-style: bold

text:
  special:
    foreground: black
    background: khaki

  todo:
    font-style: bold

  licenses:
    foreground: gray

  configuration:
    foreground: green

  other:
    foreground: gold

markup:
  foreground: gold

programming:
  source:
    foreground: springgreen

  tooling:
    foreground: green

    continuous-integration:
      foreground: khaki

media:
  foreground: orange

office:
  foreground: khaki

archives:
  foreground: pink
  font-style: underline

executable:
  foreground: pink
  font-style: bold

unimportant:
  foreground: dimgray
