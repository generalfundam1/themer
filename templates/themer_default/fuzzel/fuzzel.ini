# themer: the keys the fuzzel module sets in ~/.config/fuzzel/fuzzel.ini.
# Fuzzel's own layout, in the theme's colors: a popover on the raised tone, the
# match in the accent, the selection a step toward the text, rounded as Adwaita
# rounds its popovers. Colors are RRGGBBAA.
[main]
font={{font_family}}:size={{font_size}}

[colors]
background={{raised}}ff
text={{fg}}ff
prompt={{fg}}ff
placeholder={{disabled}}ff
input={{fg}}ff
match={{glyph_hover}}ff
selection={{control_hover}}ff
selection-text={{fg}}ff
selection-match={{glyph_hover}}ff
counter={{disabled}}ff
border={{line}}ff

[border]
width=1
radius=12
